[[milestones]]
version = "0.8.0"
generation = "V1"
name = "Listing, block APIs, and continuation tokens"
status = "active"
deliverables = [
  "Implement Azure-compatible container and blob listing without exposing Overmesh internal namespaces.",
  "Implement supported block staging, block-list inspection, and block-list commit operations under W=2.",
  "Issue signed opaque continuation tokens bound to account, container, prefix, delimiter, Ring version, and listing position.",
  "Preserve caller/control identity separation and validate every client-visible result against signed Overmesh state.",
  "Extend deterministic, system, SDK, CLI, AzCopy, and live Azure gates for the new operations."
]

[[milestones]]
version = "0.9.0"
generation = "V1"
name = "ACA infrastructure, client compatibility, and live Azure conformance"
status = "planned"
deliverables = [
  "Provision private Azure Container Apps environments for the Gateway and Reconciler before client conformance work.",
  "Deploy managed-identity-only Gateway and Reconciler revisions with private Storage and Key Vault connectivity.",
  "Integrate Azure Front Door with caching and content transformation disabled for Blob data-plane routes.",
  "Validate Azure SDK .NET, Python, and JavaScript, Azure CLI, and AzCopy against the deployed surface.",
  "Complete two-region live Azure conformance and retain signed deployment evidence."
]

[[milestones]]
version = "0.10.0"
generation = "V1"
name = "Live performance baseline and historical comparison"
status = "planned"
deliverables = [
  "Compare direct Azure Storage operations with the same operations through Overmesh.",
  "Measure latency percentiles, throughput, backend round trips, signing latency, CPU, and memory.",
  "Cover representative payload sizes, ranges, concurrency levels, and supported client operations.",
  "Store signed machine-readable results with commit, Ring, deployment, API-version, and environment provenance."
]

[[milestones]]
version = "0.11.0"
generation = "V1"
name = "Performance optimization and regression hardening"
status = "planned"
deliverables = [
  "Profile bottlenecks demonstrated by the 0.10.0 baseline.",
  "Reduce avoidable round trips, serialization, signing, buffering, and scheduling overhead without weakening invariants.",
  "Re-run the identical live benchmark matrix and record before-and-after evidence.",
  "Add performance regression budgets to release validation where measurements are stable."
]

