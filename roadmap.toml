[[milestones]]
version = "0.8.0"
generation = "V1"
name = "Listing, block APIs, and continuation tokens"
status = "completed"
deliverables = [
  "Implement Azure-compatible container and blob listing without exposing Overmesh internal namespaces.",
  "Implement supported block staging, block-list inspection, and block-list commit operations under W=2.",
  "Issue signed opaque continuation tokens bound to account, container, prefix, delimiter, Ring version, and listing position.",
  "Preserve caller/control identity separation and validate every client-visible result against signed Overmesh state.",
  "Extend deterministic, system, SDK, CLI, AzCopy, and live Azure gates for the new operations.",
  "Define deterministic concurrent-list semantics, block-generation retention, staged repair, and fail-closed GC evidence.",
  "Validate RF=2 placement across three local Storage backends and prove that a single backend outage affects only writes whose replica set contains that backend."
]

[[milestones]]
version = "0.9.0"
generation = "V1"
name = "ACA infrastructure, client compatibility, and live Azure conformance"
status = "completed"
deliverables = [
  "Provision private Azure Container Apps environments for the Gateway and Reconciler before client conformance work.",
  "Deploy managed-identity-only Gateway and Reconciler revisions with private Storage and Key Vault connectivity.",
  "Validate startup against Azure Resource Manager and refuse readiness unless every Ring Storage Account location matches its signed Ring region and all Ring nodes use distinct Azure regions.",
  "Run live Azure placement and single-Storage-Account failure tests with at least three Storage Accounts while preserving RF=2.",
  "Integrate Azure Front Door with caching and content transformation disabled for Blob data-plane routes.",
  "Validate Azure SDK .NET, Python, and JavaScript, Azure CLI, and AzCopy against the deployed surface.",
  "Complete two-region live Azure conformance and retain signed deployment evidence."
]

[[milestones]]
version = "0.9.1"
generation = "V1"
name = "Published documentation and drift enforcement"
status = "completed"
deliverables = [
  "Publish the specifications, rationale, compatibility matrix, and architecture decision records as a GitHub Pages site built with a pinned Zola release.",
  "Assemble site content from the documents where they already live, leaving specifications at the repository root and rationale and decision records under docs/, and keep the generated content tree out of version control so that no authored document is duplicated.",
  "Apply the agreed visual identity derived from the reference mockups: pure-black landing surface, softened reading surface for long documents, rationed accent and glow usage, vector ring mark, and self-hosted typefaces with no third-party font requests.",
  "Provide full-text search over the built output with Pagefind, heading anchors, and a per-page table of contents for documents that exceed a few screens.",
  "Add an overmesh-harness doc-check subcommand that fails closed when an authored Markdown document is not registered for publication, when an accepted decision record cites verification evidence that no longer exists, or when a documented count, milestone, or version disagrees with the repository.",
  "Run doc-check in the pull-request gate so that documentation drift fails before publication rather than after it.",
  "Publish through a dedicated GitHub Pages workflow triggered only by documentation and site paths, with pinned tool versions and least-privilege permissions, and exclude documentation-only changes from the code validation workflow."
]

[[milestones]]
version = "0.10.0"
generation = "V1"
name = "Live performance baseline and historical comparison"
status = "completed"
deliverables = [
  "Compare direct Azure Storage operations with the same operations through Overmesh.",
  "Measure latency percentiles, throughput, backend round trips, signing latency, CPU, and memory.",
  "Cover representative payload sizes, ranges, concurrency levels, and supported client operations.",
  "Store signed machine-readable results with commit, Ring, deployment, API-version, and environment provenance."
]

[[milestones]]
version = "0.10.1"
generation = "V1"
name = "Request-budgeted performance baseline"
status = "active"
deliverables = [
  "Prove that every outbound Storage request is instrumented and attributable to one measured client request.",
  "Publish backend request budgets by operation, object class, status, and replica without retaining raw request identifiers.",
  "Close the first-PUT control-read decomposition and preserve the strict quarantine and compaction safety reads.",
  "Remove redundant logical read probes where physical content HEADs enforce the same supported Azure RBAC posture.",
  "Measure first writes, established overwrites, reads, ranges, HEAD, and deletes under versioned contracts, with v3 stabilizing read percentiles through workload-specific sample counts.",
  "Retain signed canonical evidence and privately replicated raw archives with registered hashes and locations."
]

[[milestones]]
version = "0.11.0"
generation = "V1"
name = "Performance optimization and regression hardening"
status = "planned"
deliverables = [
  "Profile bottlenecks demonstrated by the 0.10.1 read-stabilized baseline.",
  "Reduce avoidable round trips, serialization, signing, buffering, and scheduling overhead without weakening invariants.",
  "Re-run the identical live benchmark matrix and record before-and-after evidence.",
  "Add performance regression budgets to release validation where measurements are stable.",
  "Resolve ADR-0004 catalogue name-length rejection and conditional-publication defects together with ADR-0008 catalogue-encoding property tests.",
  "Evaluate lease-first locking only against an explicit first-write versus established-write workload policy."
]

