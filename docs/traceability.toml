# ---------------------------------------------------------------------------
# Facts asserted in prose that must match the repository.
# doc-check computes the metric, formats it with the pattern, and requires the
# resulting string to appear in the document.
# ---------------------------------------------------------------------------

[[assertion]]
document = "docs/WHY_OVERMESH.md"
metric = "unit_test_count"
pattern = "{} unit and integration tests"

[[assertion]]
document = "docs/WHY_OVERMESH.md"
metric = "scenario_count"
pattern = "{} declarative"

[[assertion]]
document = "docs/WHY_OVERMESH.md"
metric = "active_milestone"
pattern = "milestone {}"

