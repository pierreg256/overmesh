name: Build private ACR images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: 0.9.0

permissions:
  contents: read
  id-token: write

concurrency:
  group: overmesh-acr-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: live-azure

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Gateway in ACR
        env:
          ACR_NAME: ${{ vars.OVERMESH_ACR_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          az acr build \
            --registry "$ACR_NAME" \
            --file deploy/Dockerfile.gateway \
            --image "overmesh-gateway:$IMAGE_TAG" \
            --image "overmesh-gateway:sha-${GITHUB_SHA::12}" \
            .

      - name: Build Reconciler in ACR
        env:
          ACR_NAME: ${{ vars.OVERMESH_ACR_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          az acr build \
            --registry "$ACR_NAME" \
            --file deploy/Dockerfile.reconciler \
            --image "overmesh-reconciler:$IMAGE_TAG" \
            --image "overmesh-reconciler:sha-${GITHUB_SHA::12}" \
            .
