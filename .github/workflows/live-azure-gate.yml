name: Live Azure gate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: overmesh-live-azure-gate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: live-azure

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Package current source
        run: |
          tar -czf /tmp/overmesh-source.tar.gz \
            --exclude=.git \
            --exclude=.azure \
            --exclude=.harness \
            --exclude=target \
            .
          base64 -w0 /tmp/overmesh-source.tar.gz > /tmp/overmesh-source.b64
          split -b 24000 /tmp/overmesh-source.b64 /tmp/overmesh-source-chunk-

      - name: Upload source through Azure Run Command
        env:
          RESOURCE_GROUP: ${{ vars.OVERMESH_LIVE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.OVERMESH_LIVE_VM }}
        run: |
          set -euo pipefail
          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "rm -f /tmp/overmesh-ci-source.b64 && touch /tmp/overmesh-ci-source.b64" \
            --only-show-errors >/dev/null
          for file in /tmp/overmesh-source-chunk-*; do
            chunk=$(cat "$file")
            az vm run-command invoke \
              --resource-group "$RESOURCE_GROUP" \
              --name "$VM_NAME" \
              --command-id RunShellScript \
              --scripts "printf '%s' '$chunk' >> /tmp/overmesh-ci-source.b64" \
              --only-show-errors >/dev/null
          done

      - name: Build and execute retained gate
        env:
          RESOURCE_GROUP: ${{ vars.OVERMESH_LIVE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.OVERMESH_LIVE_VM }}
        run: |
          set -euo pipefail
          result=$(az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts \
              "set -eu
               export PATH=/root/.cargo/bin:\$PATH
               base64 -d /tmp/overmesh-ci-source.b64 > /tmp/overmesh-ci-source.tar.gz
               mkdir -p /opt/overmesh-src
               tar -xzf /tmp/overmesh-ci-source.tar.gz -C /opt/overmesh-src
               cd /opt/overmesh-src
               cargo build --release -p overmesh-reconciler
               cp target/release/overmesh-reconciler /usr/local/bin/overmesh-reconciler.new
               mv /usr/local/bin/overmesh-reconciler.new /usr/local/bin/overmesh-reconciler
               bash /opt/overmesh-live/run-retained-live-gate.sh
               rm -f /tmp/overmesh-ci-source.b64 /tmp/overmesh-ci-source.tar.gz
               echo __OVERMESH_LIVE_GATE_PASSED__" \
            --query "value[0].message" \
            -o tsv)
          printf '%s\n' "$result"
          grep -q "__OVERMESH_LIVE_GATE_PASSED__" <<<"$result"
