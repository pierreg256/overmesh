[workspace]
members = ["gateway", "harness", "reconciler"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94"
version = "0.9.0"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
azure_core = "1.0.0"
azure_identity = "1.0.0"
azure_security_keyvault_keys = "1.0.0"
axum = "0.8.8"
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4.5.54", features = ["derive"] }
hex = "0.4.3"
http = "1.4.0"
http-body-util = "0.1.3"
httpdate = "1.0.3"
futures-util = "0.3.31"
jsonwebtoken = "9.3.1"
p256 = { version = "0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
quick-xml = { version = "0.38.4", features = ["serialize"] }
rand = "0.8.5"
rand_chacha = "0.3.1"
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
rsa = "0.9.9"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_jcs = "0.1.0"
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tempfile = "3.24.0"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7.17", features = ["io"] }
toml = "0.9.8"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
url = "2.5.7"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
