[[exclusion]]
operation = "put_blob"
payload = "16mib"
concurrency = 16
reason = "The retained v4 matrix omitted this high-memory case; v5 preserves the gap so contract evolution does not silently redefine the baseline."

[[exclusion]]
operation = "head_blob"
payload = "1mib"
concurrency = 4
reason = "The retained v4 matrix omitted this intermediate point; v5 preserves the explicit gap."

[[exclusion]]
operation = "put_block_sequence"
payload = "100mib"
concurrency = 16
reason = "The approved v5 block-staging matrix stops at c4 to avoid turning client memory pressure into a Gateway latency signal."
