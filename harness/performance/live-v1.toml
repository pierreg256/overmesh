schema_version = 1
warmup_iterations = 3
measured_iterations = 30
request_timeout_seconds = 120
target_order = ["direct", "gateway"]

[[payload]]
id = "1kib"
size_bytes = 1024

[[payload]]
id = "1mib"
size_bytes = 1048576

[[payload]]
id = "16mib"
size_bytes = 16777216

[[workload]]
operation = "put_blob"
payloads = ["1kib", "1mib"]
concurrency = [1, 4, 16]

[[workload]]
operation = "put_blob"
payloads = ["16mib"]
concurrency = [1, 4]

[[workload]]
operation = "get_blob"
payloads = ["1kib", "1mib", "16mib"]
concurrency = [1, 4, 16]

[[workload]]
operation = "get_range"
payloads = ["16mib"]
concurrency = [1, 4, 16]
range_bytes = 1048576

[[workload]]
operation = "head_blob"
payloads = ["1mib"]
concurrency = [1, 16]

[[workload]]
operation = "delete_blob"
payloads = ["1kib"]
concurrency = [1, 4, 16]
